# Daily keep-alive pings so Supabase's free-tier inactivity scan never pauses
# the project (it pauses after ~7 days without external API traffic; internal
# pg_cron jobs don't count). Two free requests per day, no Anthropic tokens:
#   1. OPTIONS to the vita-handler edge function — answered by the function's
#      own code (204), so it registers as a real function invocation AND
#      verifies the backend is actually up.
#   2. GET /auth/v1/health with the anon key — a normal API-gateway request.
# (A REST table read isn't possible here: the anon role deliberately has zero
# privileges on every table.)
# A failed ping fails the workflow, so GitHub emails the repo owner — this
# doubles as basic uptime monitoring for the backend.
#
# Secret required: SUPABASE_ANON_KEY (publishable anon key — client-safe, but
# kept out of the repo by convention).
#
# NOTE: GitHub auto-disables scheduled workflows in repos with no commit
# activity for 60 days (it emails a warning first). If that email arrives,
# re-enable from the Actions tab — otherwise this ping AND the weekly eval
# gate stop running, and Supabase will pause the project.
name: Supabase keep-alive

on:
  schedule:
    - cron: "23 13 * * *" # daily 13:23 UTC (~9:23am ET)
  workflow_dispatch: # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # --fail turns any 4xx/5xx into a failed step (and a notification
          # email); 3 retries ride out transient network blips.
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 10 \
            -X OPTIONS \
            "https://hnezbferzpjmkgmtlgar.supabase.co/functions/v1/vita-handler" \
            > /dev/null
          echo "Edge function ping OK (204)."
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 10 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "https://hnezbferzpjmkgmtlgar.supabase.co/auth/v1/health" \
            > /dev/null
          echo "Auth health ping OK (200) — project activity registered."
