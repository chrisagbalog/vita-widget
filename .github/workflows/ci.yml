# CI — every push and PR: unit tests + a full type-checked production build.
# Needs no secrets, so it runs safely on fork PRs too.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build # includes tsc --noEmit
